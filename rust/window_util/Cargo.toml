[package]
name = "tvtest_window_util"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Rust port of TVTest's WindowUtil (window snapping, mouse wheel/leave tracking, timer management, window subclassing), using windows-rs"

[lib]
name = "tvtest_window_util"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
]
