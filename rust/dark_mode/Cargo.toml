[package]
name = "tvtest_dark_mode"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Rust port of TVTest's DarkMode helpers (dark theme detection, window/frame dark mode, app mode), using windows-rs"

[lib]
name = "tvtest_dark_mode"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
tvtest_winutil = { path = "../winutil" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
]
