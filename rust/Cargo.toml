# TVTest の C++ コードを Rust へ移植したクレート群をまとめるワークスペース。
# 各モジュールは原実装(src/*.cpp)とプラットフォーム非依存な範囲で挙動を一致させ、
# Rust の単体テストで等価性を検証する。
[workspace]
resolver = "2"
members = [
    "string_utility",
    "path_util",
    "util",
    "winutil",
    "ini_file",
    "variable_string",
    "network_definition",
    "keyword_search",
    "channel_history",
    "epg_util",
    "command_line",
    "channel_list",
    "variable_manager",
    "program_search",
    "regexp",
    "program_guide_favorites",
    "settings_util",
    "epgdatatojson",
    "libisdb/libisdb_datetime",
    "libisdb/libisdb_crc", "libisdb/libisdb_md5", "libisdb/libisdb_bitrate", "libisdb/libisdb_bitstream", "libisdb/libisdb_ts_info", "libisdb/libisdb_utilities", "libisdb/libisdb_descriptor", "libisdb/libisdb_ts_packet", "libisdb/libisdb_psi_section", "libisdb/libisdb_pes_packet", "libisdb/libisdb_adts_parser", "libisdb/libisdb_mpeg2_video_parser", "libisdb/libisdb_h26x_parser", "libisdb/libisdb_pid_map", "libisdb/libisdb_psi_table", "libisdb/libisdb_ts_tables", "libisdb/libisdb_arib_string", "libisdb/libisdb_event_info", "libisdb/libisdb_epg_data_file",
    "libisdb/libisdb_one_seg_pat_generator",
    "libisdb/libisdb_caption_parser",
    "libisdb/libisdb_stream_selector",
    "libisdb/libisdb_pmt_analyzer",
    "libisdb/libisdb_eit_analyzer",
    "libisdb/libisdb_nit_analyzer",
    "libisdb/libisdb_bit_analyzer",
    "libisdb/libisdb_sdt_analyzer",
    "libisdb/libisdb_ts_download",
    "libisdb/libisdb_data_buffer",
    "libisdb/libisdb_data_storage",
    "libisdb/libisdb_stream_buffer",
    "libisdb/libisdb_epg_database",
    "libisdb/libisdb_data_streamer",
    "libisdb/libisdb_filter_base",
    "libisdb/libisdb_ts_packet_parser_filter",
    "libisdb/libisdb_tee_filter",
    "libisdb/libisdb_ts_packet_counter_filter",
    "libisdb/libisdb_grabber_filter",
    "libisdb/libisdb_service_selector_filter",
    "libisdb/libisdb_caption_filter",
    "libisdb/libisdb_epg_database_filter",
    "libisdb/libisdb_logo_downloader_filter",
    "libisdb/libisdb_source_filter",
    "libisdb/libisdb_stream_buffer_filter",
    "libisdb/libisdb_async_streaming_filter",
    "libisdb/libisdb_stream",
    "libisdb/libisdb_stream_source_filter",
]
