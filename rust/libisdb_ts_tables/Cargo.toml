[package]
name = "libisdb_ts_tables"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Rust port of LibISDB Tables.cpp: PAT/PMT/SDT/NIT/EIT/BIT/TOT/CDT/SDTT/PCR"

[lib]
name = "libisdb_ts_tables"
path = "src/lib.rs"

[dependencies]
libisdb_ts_packet = { path = "../libisdb_ts_packet" }
libisdb_psi_section = { path = "../libisdb_psi_section" }
libisdb_psi_table = { path = "../libisdb_psi_table" }
libisdb_descriptor = { path = "../libisdb_descriptor" }
libisdb_utilities = { path = "../libisdb_utilities" }
libisdb_datetime = { path = "../libisdb_datetime" }

[dev-dependencies]
libisdb_crc = { path = "../libisdb_crc" }
