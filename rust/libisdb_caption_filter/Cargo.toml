[package]
name = "libisdb_caption_filter"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Rust port of LibISDB/Filters/CaptionFilter.cpp: ARIB caption extraction filter (PAT/PMT tracking + PES assembly + caption parsing)"

[lib]
name = "libisdb_caption_filter"
path = "src/lib.rs"

[dependencies]
libisdb_filter_base = { path = "../libisdb_filter_base" }
libisdb_ts_packet = { path = "../libisdb_ts_packet" }
libisdb_ts_info = { path = "../libisdb_ts_info" }
libisdb_ts_tables = { path = "../libisdb_ts_tables" }
libisdb_descriptor = { path = "../libisdb_descriptor" }
libisdb_pes_packet = { path = "../libisdb_pes_packet" }
libisdb_caption_parser = { path = "../libisdb_caption_parser" }
libisdb_arib_string = { path = "../libisdb_arib_string" }

[dev-dependencies]
libisdb_crc = { path = "../libisdb_crc" }
