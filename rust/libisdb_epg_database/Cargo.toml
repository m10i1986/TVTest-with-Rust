[package]
name = "libisdb_epg_database"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Rust port of LibISDB/EPG/EPGDatabase.cpp: EPG event database with EIT schedule tracking"

[lib]
name = "libisdb_epg_database"
path = "src/lib.rs"

[dependencies]
bitflags = "2"
libisdb_datetime    = { path = "../libisdb_datetime" }
libisdb_event_info  = { path = "../libisdb_event_info" }
libisdb_ts_tables   = { path = "../libisdb_ts_tables" }
libisdb_descriptor  = { path = "../libisdb_descriptor" }
libisdb_arib_string = { path = "../libisdb_arib_string" }

[dev-dependencies]
libisdb_crc       = { path = "../libisdb_crc" }
libisdb_ts_packet = { path = "../libisdb_ts_packet" }
